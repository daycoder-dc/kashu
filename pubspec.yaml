name: kashu
description: "Administrador de finanzas personales offline"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^15.1.0

  # Database (drift - SQLite)
  drift: ^2.25.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Functional Programming
  fpdart: ^1.1.0

  # Charts
  fl_chart: ^0.70.2

  # Authentication
  local_auth: ^2.3.0
  flutter_secure_storage: ^10.0.0

  # Media
  image_picker: ^1.1.2

  # UI & Theming
  flex_color_scheme: ^8.1.0
  google_fonts: ^6.2.1
  phosphoricons_flutter: ^1.0.0
  smooth_page_indicator: ^1.2.0+3

  # Utilities
  intl: ^0.20.2
  get_it: ^8.0.3
  file_picker: ^13.0.0

dependency_overrides:
  win32: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.25.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
